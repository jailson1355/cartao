<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Cartão de Crédito e Pix Real</title>
    <!-- Biblioteca para gerar o QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
          --bg-principal: #0f172a;
          --bg-card: #1e293b;
          --text-principal: #f8fafc;
          --text-secundario: #94a3b8;
          --cor-sucesso: #10b981;
          --cor-erro: #ef4444;
          --cor-destaque: #6366f1;
          --cor-destaque-hover: #4f46e5;
          --cor-pix: #12b1a4;
          --gradiente-cartao: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
          --borda: #334155;
        }

        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: 'Segoe UI', sans-serif;
        }

        body {
          background-color: var(--bg-principal);
          color: var(--text-principal);
          min-height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 20px;
        }

        .container {
          width: 100%;
          max-width: 900px;
          display: grid;
          grid-template-columns: 1fr;
          gap: 30px;
          margin: 0 auto;
        }

        @media (min-width: 768px) {
          .container {
            grid-template-columns: 1fr 1fr;
            align-items: start;
          }
        }

        .col-esquerda {
          display: flex;
          flex-direction: column;
          gap: 20px;
          width: 100%;
          align-items: center;
        }

        .cartao-credito {
          background: var(--gradiente-cartao);
          border: 1px solid var(--borda);
          border-radius: 20px;
          padding: 25px;
          width: 100%;
          max-width: 380px;
          height: 220px;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .cartao-topo {
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .cartao-chip {
          width: 45px;
          height: 35px;
          background: linear-gradient(135deg, #cbd5e1 0%, #94a3b8 100%);
          border-radius: 6px;
        }

        .cartao-numero {
          font-size: 1.2rem;
          letter-spacing: 2px;
          font-family: monospace;
        }

        .cartao-infos {
          display: flex;
          justify-content: space-between;
          align-items: flex-end;
        }

        .cartao-nome {
          font-size: 0.95rem;
          font-weight: bold;
          letter-spacing: 1px;
          text-transform: uppercase;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .painel-formulario {
          background-color: var(--bg-card);
          border: 1px solid var(--borda);
          border-radius: 20px;
          padding: 25px;
          width: 100%;
        }

        .painel-formulario h2 {
          margin-bottom: 10px;
          font-size: 1.3rem;
        }

        .limite-info {
          font-size: 0.9rem;
          color: var(--text-secundario);
          margin-bottom: 15px;
        }

        .grupo-botoes {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 10px;
          margin-bottom: 15px;
        }

        .btn-valor {
          background-color: var(--bg-principal);
          color: var(--text-principal);
          border: 1px solid var(--borda);
          padding: 10px;
          border-radius: 10px;
          cursor: pointer;
          font-weight: bold;
          transition: 0.2s;
        }

        .btn-valor:hover {
          background-color: var(--cor-destaque);
          border-color: var(--cor-destaque);
        }

        .input-personalizado {
          width: 100%;
          padding: 10px;
          border-radius: 10px;
          border: 1px solid var(--borda);
          background-color: var(--bg-principal);
          color: var(--text-principal);
          margin-bottom: 15px;
          font-size: 1rem;
        }

        /* Botão fixo de pagamento/zerar */
        .btn-pagar-fixo {
          background-color: var(--cor-sucesso);
          color: white;
          border: none;
          padding: 12px;
          border-radius: 10px;
          cursor: pointer;
          font-weight: bold;
          font-size: 1rem;
          width: 100%;
          margin-bottom: 15px;
          transition: 0.2s;
        }

        .btn-pagar-fixo:hover {
          opacity: 0.9;
        }

        .area-pix {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 12px;
          border-top: 1px solid var(--borda);
          padding-top: 15px;
        }

        #qrcode {
          background: white;
          padding: 10px;
          border-radius: 10px;
        }

        .status-pagamento {
          font-weight: bold;
          text-align: center;
          font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Coluna do Cartão -->
        <div class="col-esquerda">
            <div class="cartao-credito">
                <div class="cartao-topo">
                    <div class="cartao-chip"></div>
                    <span style="font-weight: bold; color: var(--cor-pix);">PIX / Crédito</span>
                </div>
                <div class="cartao-numero">4532 8900 1234 5678</div>
                <div class="cartao-infos">
                    <div class="cartao-nome">JAILSON FREire DOS SANTOS</div>
                </div>
            </div>
        </div>

        <!-- Painel de Inputs -->
        <div class="painel-formulario">
            <h2>Simulador Pix</h2>
            <div class="limite-info">Limite disponível: <strong id="limite-val">R$ 3.000,00</strong></div>
           
            <div class="grupo-botoes">
                <button class="btn-valor" onclick="selecionarValor(50)">R$ 50</button>
                <button class="btn-valor" onclick="selecionarValor(100)">R$ 100</button>
                <button class="btn-valor" onclick="selecionarValor(200)">R$ 200</button>
                <button class="btn-valor" onclick="selecionarValor(500)">R$ 500</button>
                <button class="btn-valor" onclick="selecionarValor(1000)">R$ 1.000</button>
                <button class="btn-valor" onclick="selecionarValor(2000)">R$ 2.000</button>
            </div>

            <input type="number" id="valor-custom" class="input-personalizado" placeholder="Ou digite outro valor" oninput="atualizarValorCustom()">

            <!-- Botão fixo de Pagamento/Zerar -->
            <button class="btn-pagar-fixo" onclick="realizarPagamento()">Efetuar Pagamento / Zerar</button>

            <!-- Display do QR Code -->
            <div class="area-pix" id="container-pix" style="display: none;">
                <p id="texto-valor-pix" style="font-weight: bold; color: var(--cor-pix);"></p>
                <div id="qrcode"></div>
                <div id="status-msg" class="status-pagamento"></div>
            </div>
        </div>
    </div>

    <script>
        let limiteMaximo = 3000;
        let valorAtual = 100; // Valor padrão inicial

        function selecionarValor(valor) {
            valorAtual = valor;
            document.getElementById('valor-custom').value = '';
            gerarQrCode(valorAtual);
        }

        function atualizarValorCustom() {
            let val = parseFloat(document.getElementById('valor-custom').value);
            if (!isNaN(val) && val > 0) {
                valorAtual = val;
                gerarQrCode(valorAtual);
            } else {
                document.getElementById('container-pix').style.display = 'none';
            }
        }

        function gerarQrCode(valor) {
            document.getElementById('container-pix').style.display = 'flex';
            document.getElementById('texto-valor-pix').innerText = `QR Code Pix: R$ ${valor.toFixed(2)}`;
            document.getElementById('status-msg').innerText = "";
           
            document.getElementById('qrcode').innerHTML = "";

            let payloadSimulado = `00020126580014br.gov.bcb.pix0136jailsonsantos@email.com5204000053039865802BR5925JAILSON FREDDY DOS SANTOS6009RIO JANEIRO62070503***6304VALOR:${valor}`;

            new QRCode(document.getElementById("qrcode"), {
                text: payloadSimulado,
                width: 120,
                height: 120
            });
        }

        function realizarPagamento() {
            let statusDiv = document.getElementById('status-msg');
           
            if (valorAtual > limiteMaximo) {
                statusDiv.style.color = "var(--cor-erro)";
                statusDiv.innerText = "Erro: Valor acima do limite do cartão!";
                return;
            }

            limiteMaximo -= valorAtual;
            document.getElementById('limite-val').innerText = `R$ ${limiteMaximo.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
           
            statusDiv.style.color = "var(--cor-sucesso)";
            statusDiv.innerText = `Pagamento de R$ ${valorAtual.toFixed(2)} efetuado com sucesso!`;
        }

        // Inicializa gerando o QR Code padrão de R$ 100 para o botão fixo funcionar logo de cara
        gerarQrCode(valorAtual);
    </script>
    <script>
    let limiteMaximo = 3000;
    let valorAtual = 100;

    // Busca o limite real lá do servidor Python assim que a página abre
    window.onload = async function() {
        try {
            let resposta = await fetch('http://127.0.0.1:5000/api/cartao');
            let dados = await resposta.json();
            limiteMaximo = dados.limite_disponivel;
            document.getElementById('limite-val').innerText = `R$ ${limiteMaximo.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
        } catch (erro) {
            console.log("Aviso: Servidor Python não está conectado.");
        }
        gerarQrCode(valorAtual);
    };

    function selecionarValor(valor) {
        valorAtual = valor;
        document.getElementById('valor-custom').value = '';
        gerarQrCode(valorAtual);
    }

    function atualizarValorCustom() {
        let val = parseFloat(document.getElementById('valor-custom').value);
        if (!isNaN(val) && val > 0) {
            valorAtual = val;
            gerarQrCode(valorAtual);
        } else {
            document.getElementById('container-pix').style.display = 'none';
        }
    }

    function gerarQrCode(valor) {
        document.getElementById('container-pix').style.display = 'flex';
        document.getElementById('texto-valor-pix').innerText = `QR Code Pix: R$ ${valor.toFixed(2)}`;
        document.getElementById('status-msg').innerText = "";
       
        document.getElementById('qrcode').innerHTML = "";
        let payloadSimulado = `00020126580014br.gov.bcb.pix0136jailsonsantos@email.com5204000053039865802BR5925JAILSON FREDDY DOS SANTOS6009RIO JANEIRO62070503***6304VALOR:${valor}`;

        new QRCode(document.getElementById("qrcode"), { text: payloadSimulado, width: 120, height: 120 });
    }

    // Essa função envia o pagamento para a API em Python que está rodando no seu terminal
    async function realizarPagamento() {
        let statusDiv = document.getElementById('status-msg');
        statusDiv.style.color = "var(--text-secundario)";
        statusDiv.innerText = "Processando pagamento no servidor...";
       
        try {
            let resposta = await fetch('http://127.0.0.1:5000/api/pagar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ valor: valorAtual })
            });

            let dados = await resposta.json();

            if (dados.sucesso) {
                limiteMaximo = dados.novo_limite;
                document.getElementById('limite-val').innerText = `R$ ${limiteMaximo.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
                statusDiv.style.color = "var(--cor-sucesso)";
                statusDiv.innerText = dados.mensagem;
            } else {
                statusDiv.style.color = "var(--cor-erro)";
                statusDiv.innerText = "Erro: " + dados.mensagem;
            }
        } catch (erro) {
            statusDiv.style.color = "var(--cor-erro)";
            statusDiv.innerText = "Erro: O servidor Python está desligado!";
        }
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Cartão de Crédito PRO</title>
    <style>
        /* ==========================================================================
           1. CONFIGURAÇÕES GERAIS E VARIÁVEIS DE CORES (CSS MODERNO)
           ========================================================================== */
        :root {
            --bg-principal: #0f172a;
            --bg-card: #1e293b;
            --text-principal: #f8fafc;
            --text-secundario: #94a3b8;
            --cor-sucesso: #10b981;
            --cor-erro: #ef4444;
            --cor-destaque: #6366f1;
            --cor-destaque-hover: #4f46e5;
            --gradiente-cartao: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --borda: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--text-principal);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 1fr 1fr;
                align-items: start;
            }
        }

        /* ==========================================================================
           2. ESTILIZAÇÃO VISUAL DO CARTÃO DE CRÉDITO (INTERFACE)
           ========================================================================== */
        .painel-esquerdo {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cartao-credito {
            background: var(--gradiente-cartao);
            border-radius: 20px;
            padding: 25px;
            height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .cartao-credito::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            transform: rotate(30deg);
            pointer-events: none;
        }

        .cartao-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .banco-nome {
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .chip {
            width: 45px;
            height: 35px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border-radius: 6px;
            position: relative;
        }

        .cartao-numero {
            font-size: 1.3rem;
            letter-spacing: 3px;
            margin-top: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
        }

        .cartao-dados {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .titular-label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .titular-nome {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bandeira {
            font-size: 1.4rem;
            font-style: italic;
            font-weight: bold;
        }

        .painel-valores {
            background-color: var(--bg-card);
            border: 1px solid var(--borda);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .valor-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--borda);
        }

        .valor-box:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .valor-label {
            color: var(--text-secundario);
            font-size: 0.9rem;
        }

        .valor-numero {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .cor-limite { color: var(--cor-sucesso); }
        .cor-fatura { color: var(--cor-erro); }

        /* ==========================================================================
           3. FORMULÁRIO DE OPERAÇÕES E HISTÓRICO
           ========================================================================== */
        .painel-direito {
            background-color: var(--bg-card);
            border: 1px solid var(--borda);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 5px;
            color: var(--text-principal);
        }

        .form-grupo {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-secundario);
        }

        input, select {
            background-color: var(--bg-principal);
            border: 1px solid var(--borda);
            color: var(--text-principal);
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--cor-destaque);
        }

        /* Ajuste para colocar Valor e Parcelas lado a lado */
        .form-linha {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            background-color: var(--cor-destaque);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: var(--cor-destaque-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secundario {
            background-color: transparent;
            border: 1px solid var(--borda);
            color: var(--text-secundario);
            margin-top: -5px;
        }

        .btn-secundario:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-principal);
        }

        .mensagem {
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
            text-align: center;
            font-weight: 500;
        }

        .mensagem.sucesso {
            display: block;
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--cor-sucesso);
            border: 1px solid var(--cor-sucesso);
        }

        .mensagem.erro {
            display: block;
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--cor-erro);
            border: 1px solid var(--cor-erro);
        }

        .historico-container {
            margin-top: 10px;
        }

        .lista-transacoes {
            list-style: none;
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 5px;
        }

        .lista-transacoes::-webkit-scrollbar {
            width: 6px;
        }
        .lista-transacoes::-webkit-scrollbar-thumb {
            background-color: var(--borda);
            border-radius: 3px;
        }

        .transacao-item {
            background-color: var(--bg-principal);
            border: 1px solid var(--borda);
            padding: 10px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .transacao-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .transacao-estabelecimento {
            font-weight: bold;
        }

        .transacao-parcelas {
            color: var(--cor-destaque);
            font-size: 0.75rem;
            font-weight: 500;
        }

        .transacao-data {
            color: var(--text-secundario);
            font-size: 0.75rem;
        }

        .transacao-valores {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }

        .transacao-valor {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
       
        <div class="painel-esquerdo">
            <div class="cartao-credito">
                <div class="cartao-topo">
                    <span class="banco-nome">DevBank Code</span>
                    <div class="chip"></div>
                </div>
                <div class="cartao-numero">4532 •••• •••• 8841</div>
                <div class="cartao-dados">
                    <div>
                        <div class="titular-label">Titular do Cartão</div>
                        <div class="titular-nome">Dev Master Pro</div>
                    </div>
                    <div class="bandeira">VISA</div>
                </div>
            </div>

            <div class="painel-valores">
                <div class="valor-box">
                    <span class="valor-label">Limite Total:</span>
                    <span class="valor-numero" id="txt-limite-total">R$ 0,00</span>
                </div>
                <div class="valor-box">
                    <span class="valor-label">Fatura Atual (Gasto):</span>
                    <span class="valor-numero cor-fatura" id="txt-fatura-atual">R$ 0,00</span>
                </div>
                <div class="valor-box">
                    <span class="valor-label">Limite Disponível para Compra:</span>
                    <span class="valor-numero cor-limite" id="txt-limite-disponivel">R$ 0,00</span>
                </div>
            </div>
        </div>

        <div class="painel-direito">
            <div>
                <h2>Simulador de Transações</h2>
                <p style="color: var(--text-secundario); font-size: 0.85rem;">Treine a lógica de validações comerciais e bancárias.</p>
            </div>

            <div id="caixa-mensagem" class="mensagem"></div>

            <div class="form-grupo">
                <label for="input-estabelecimento">Estabelecimento / Loja</label>
                <input type="text" id="input-estabelecimento" placeholder="Ex: Mercado Livre, Miranda...">
            </div>

            <!-- VALOR E PARCELAS LADO A LADO -->
            <div class="form-linha">
                <div class="form-grupo">
                    <label for="input-valor">Valor Total (R$)</label>
                    <input type="number" id="input-valor" placeholder="0.00" step="0.01" min="0.01">
                </div>
                <div class="form-grupo">
                    <label for="select-parcelas">Opções de Parcelas</label>
                    <select id="select-parcelas">
                        <option value="1">À vista</option>
                        <option value="2">2x sem juros</option>
                        <option value="3">3x sem juros</option>
                        <option value="4">4x sem juros</option>
                        <option value="5">5x sem juros</option>
                        <option value="6">6x sem juros</option>
                        <option value="10">10x sem juros</option>
                        <option value="12">12x sem juros</option>
                    </select>
                </div>
            </div>

            <button class="btn" id="btn-comprar">Simular Autorização de Compra</button>
            <button class="btn btn-secundario" id="btn-pagar">Pagar Fatura Integralmente</button>

            <div class="historico-container">
                <h2 style="font-size: 1rem; margin-bottom: 10px;">Histórico de Compras Aprovadas</h2>
                <ul class="lista-transacoes" id="lista-compras"></ul>
            </div>
        </div>

    </div>

    <!-- ==========================================================================
       4. SCRIPT JAVASCRIPT (LÓGICA ATUALIZADA COM PARCELAMENTO)
       ========================================================================== -->
    <script>
        const bancoDeDadosSimulado = {
            limiteTotal: 2500.00,
            faturaAtual: 0.00,
            getLimiteDisponivel: function() {
                return this.limiteTotal - this.faturaAtual;
            }
        };

        const historicoDeTransacoes = [];

        const txtLimiteTotal = document.getElementById('txt-limite-total');
        const txtFaturaAtual = document.getElementById('txt-fatura-atual');
        const txtLimiteDisponivel = document.getElementById('txt-limite-disponivel');
       
        const inputEstabelecimento = document.getElementById('input-estabelecimento');
        const inputValor = document.getElementById('input-valor');
        const selectParcelas = document.getElementById('select-parcelas');
       
        const btnComprar = document.getElementById('btn-comprar');
        const btnPagar = document.getElementById('btn-pagar');
        const caixaMensagem = document.getElementById('caixa-mensagem');
        const listaComprasVisual = document.getElementById('lista-compras');

        function atualizarTela() {
            txtLimiteTotal.innerText = bancoDeDadosSimulado.limiteTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            txtFaturaAtual.innerText = bancoDeDadosSimulado.faturaAtual.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            txtLimiteDisponivel.innerText = bancoDeDadosSimulado.getLimiteDisponivel().toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function exibirNotificacao(texto, tipo) {
            caixaMensagem.className = "mensagem " + tipo;
            caixaMensagem.innerText = texto;
           
            setTimeout(() => {
                caixaMensagem.className = "mensagem";
            }, 4000);
        }

        function atualizarHistoricoVisual() {
            listaComprasVisual.innerHTML = "";

            for (let i = historicoDeTransacoes.length - 1; i >= 0; i--) {
                const transacao = historicoDeTransacoes[i];
                const li = document.createElement('li');
                li.className = 'transacao-item';
               
                // Texto customizado se for à vista ou parcelado
                const textoParcela = transacao.qtdParcelas === 1
                    ? "À vista"
                    : `${transacao.qtdParcelas}x de ${transacao.valorParcela.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}`;

                li.innerHTML = `
                    <div class="transacao-info">
                        <span class="transacao-estabelecimento">${transacao.loja}</span>
                        <span class="transacao-parcelas">${textoParcela}</span>
                        <span class="transacao-data">${transacao.dataHora}</span>
                    </div>
                    <div class="transacao-valores">
                        <span class="transacao-valor cor-fatura">- ${transacao.valorTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</span>
                    </div>
                `;
                listaComprasVisual.appendChild(li);
            }
        }

        btnComprar.addEventListener('click', function() {
            const nomeLoja = inputEstabelecimento.value.trim();
            const valorCompraTotal = parseFloat(inputValor.value);
            const numeroDeParcelas = parseInt(selectParcelas.value);

            if (nomeLoja === "" || isNaN(valorCompraTotal) || valorCompraTotal <= 0) {
                exibirNotificacao("Por favor, insira um nome de loja válido e um valor maior que zero.", "erro");
                return;
            }

            const limiteDisponivelNoMomento = bancoDeDadosSimulado.getLimiteDisponivel();

            // Importante: No crédito, a validação consome o VALOR TOTAL da compra no limite, não apenas a primeira parcela!
            if (valorCompraTotal <= limiteDisponivelNoMomento) {
               
                // Lógica Matemática do Parcelamento
                bancoDeDadosSimulado.faturaAtual += valorCompraTotal;
                const valorDaCadaParcela = valorCompraTotal / numeroDeParcelas;
               
                const agora = new Date();
                historicoDeTransacoes.push({
                    loja: nomeLoja,
                    valorTotal: valorCompraTotal,
                    qtdParcelas: numeroDeParcelas,
                    valorParcela: valorDaCadaParcela,
                    dataHora: agora.toLocaleDateString('pt-BR') + ' ' + agora.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})
                });

                exibirNotificacao(`Compra de R$ ${valorCompraTotal.toFixed(2)} aprovada em ${numeroDeParcelas}x!`, "sucesso");
               
                inputEstabelecimento.value = "";
                inputValor.value = "";
                selectParcelas.value = "1"; // Volta para o padrão à vista

                atualizarTela();
                atualizarHistoricoVisual();

            } else {
                const faltaQuanto = valorCompraTotal - limiteDisponivelNoMomento;
                exibirNotificacao(`Transação Recusada: Limite Insuficiente! Falta R$ ${faltaQuanto.toFixed(2)} de saldo livre.`, "erro");
            }
        });

        btnPagar.addEventListener('click', function() {
            if (bancoDeDadosSimulado.faturaAtual === 0) {
                exibirNotificacao("Sua fatura já está zerada. Não há o que pagar!", "erro");
                return;
            }

            bancoDeDadosSimulado.faturaAtual = 0.00;
            exibirNotificacao("Fatura paga com sucesso! Seu limite foi totalmente restabelecido.", "sucesso");
           
            atualizarTela();
        });

        atualizarTela();
    </script>
</body>
</html>
